name: Aggiorna dati carburanti

on:
  schedule:
    # Orari in UTC: circa 9:20 e 12:20 in Italia (un'ora prima d'inverno)
    - cron: '20 7 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch: # permette di avviarlo a mano dal sito di GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepara i dati
        run: node build.mjs --out public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
