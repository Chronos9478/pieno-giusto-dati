name: Aggiorna dati carburanti

on:
  schedule:
    # Orari in UTC: circa 9:20 e 12:20 in Italia (un'ora prima d'inverno)
    - cron: '20 7 * * *'
    - cron: '20 10 * * *'
  workflow_dispatch: # permette di avviarlo a mano dal sito di GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scarica i file del Ministero
        # Il sito del Ministero a volte risponde lentamente ai server esteri:
        # curl aspetta fino a 2 minuti per collegarsi e riprova da solo.
        run: |
          for f in anagrafica_impianti_attivi prezzo_alle_8; do
            curl --fail --silent --show-error --location \
              --connect-timeout 120 --max-time 600 \
              --retry 4 --retry-delay 30 --retry-all-errors \
              -A "PienoGiusto-dati/1.0 (github.com/${{ github.repository }})" \
              -o "$f.csv" "https://www.mimit.gov.it/images/exportCSV/$f.csv"
            echo "$f.csv: $(wc -l < "$f.csv") righe"
          done
      - name: Prepara i dati
        run: node build.mjs --impianti anagrafica_impianti_attivi.csv --prezzi prezzo_alle_8.csv --out public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
